AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Fargate Sidecar Pattern - Frontend (Port 5000) + Processor (Port 5001) with ALB (AWS Academy)

Parameters:
  LabRoleArn:
    Type: String
    Description: ARN of the AWS Academy LabRole (e.g. arn:aws:iam::123456789012:role/LabRole)
    AllowedPattern: "arn:aws:iam::[0-9]{12}:role/LabRole"
    ConstraintDescription: Must be a valid LabRole ARN (arn:aws:iam::ACCOUNT_ID:role/LabRole)

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for the deployment

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: First public subnet (for ALB and ECS Task)

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Second public subnet (for ALB)

  FrontendImage:
    Type: String
    Description: ECR image URI for the frontend container (replace ACCOUNT_ID)
    Default: "ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/service1-repo:latest"

  ProcessorImage:
    Type: String
    Description: ECR image URI for the processor container (replace ACCOUNT_ID)
    Default: "ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/service2-repo:latest"

  ClusterName:
    Type: String
    Default: microservice-cluster
    Description: Name of the ECS cluster

  ServiceName:
    Type: String
    Default: sidecar-app-service
    Description: Name of the ECS service

Resources:

  # ─────────────────────────────────────────
  # ECS Cluster
  # ─────────────────────────────────────────
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName

  # ─────────────────────────────────────────
  # CloudWatch Log Groups
  # DeletionPolicy/UpdateReplacePolicy: Retain prevents log loss on stack update/delete
  # ─────────────────────────────────────────
  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/ecs/${ServiceName}/frontend"
      RetentionInDays: 7

  ProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/ecs/${ServiceName}/processor"
      RetentionInDays: 7

  # ─────────────────────────────────────────
  # Security Group: ALB
  # Allows inbound HTTP (port 80) from the internet
  # ─────────────────────────────────────────
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB security group - allows HTTP from internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from internet
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ServiceName}-alb-sg"

  # ─────────────────────────────────────────
  # Security Group: ECS Task
  # Restricts inbound traffic to ALB only on port 5000
  # ─────────────────────────────────────────
  ECSTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS task security group - allows traffic from ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Port 5000 from ALB only
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound for ECR image pull and CloudWatch Logs
      Tags:
        - Key: Name
          Value: !Sub "${ServiceName}-task-sg"

  # ─────────────────────────────────────────
  # Application Load Balancer
  # drop_invalid_header_fields protects against HTTP request smuggling
  # ─────────────────────────────────────────
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ServiceName}-alb"
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"

  # Target group routes to the frontend container on port 5000
  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ServiceName}-tg"
      Port: 5000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  # Listener forwards HTTP port 80 to the target group
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # ─────────────────────────────────────────
  # ECS Task Definition (Sidecar Pattern)
  # Both containers share the same network namespace (localhost)
  # Cpu 512 (0.5 vCPU) requires a minimum of 1024 MB memory on Fargate
  # ─────────────────────────────────────────
  SidecarTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ServiceName}-task"
      Cpu: "512"         # 0.5 vCPU
      Memory: "1024"     # 1 GB (minimum for 0.5 vCPU on Fargate)
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      # LabRole is used instead of a custom IAM role (AWS Academy restriction)
      ExecutionRoleArn: !Ref LabRoleArn
      TaskRoleArn: !Ref LabRoleArn
      ContainerDefinitions:

        # ── Frontend container (essential) ──
        # Serves the UI on port 5000
        # Calls the processor sidecar via http://localhost:5001
        - Name: frontend
          Image: !Ref FrontendImage
          Essential: true
          PortMappings:
            - ContainerPort: 5000
              Protocol: tcp
          Environment:
            - Name: SERVICE2_URL
              Value: "http://localhost:5001/reverse"
          DependsOn:
            - ContainerName: processor
              Condition: START
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FrontendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

        # ── Processor sidecar container (non-essential) ──
        # Handles background processing on port 5001
        # Only reachable via localhost within the same task
        - Name: processor
          Image: !Ref ProcessorImage
          Essential: false
          PortMappings:
            - ContainerPort: 5001
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ProcessorLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: processor

  # ─────────────────────────────────────────
  # ECS Service
  # DependsOn ALBListener ensures the listener exists before the service registers targets
  # HealthCheckGracePeriodSeconds gives both containers time to start before ALB checks begin
  # ─────────────────────────────────────────
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref SidecarTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref ECSTaskSecurityGroup
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 5000
          TargetGroupArn: !Ref ALBTargetGroup

Outputs:
  LoadBalancerDNS:
    Description: Application URL
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"
    Export:
      Name: !Sub "${ServiceName}-alb-dns"

  ECSClusterName:
    Description: Name of the ECS cluster
    Value: !Ref ECSCluster

  ECSServiceName:
    Description: Name of the ECS service
    Value: !Ref ECSService

  ALBSecurityGroupId:
    Description: Security group ID of the ALB
    Value: !Ref ALBSecurityGroup

  ECSTaskSecurityGroupId:
    Description: Security group ID of the ECS task
    Value: !Ref ECSTaskSecurityGroup
